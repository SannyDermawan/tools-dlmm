# 2-hour session profile (laptop-friendly). Use: npm run dlmm -- -c config/session-2h.yaml session start -q
extends: default
session:
  duration_minutes: 120
  warmup_minutes: 15
  stop_new_positions_before_end_minutes: 20
  label: sesi-2jam
grid:
  cohort_interval_minutes: 30        # cohorts at +15, +45, +75 min
  signal_entry:
    trigger: both                    # signal modes also enter when a pool's signal turns admitted (MASUK
                                     # lasts about a minute: at the 3 cohort instants of the first 2 h
                                     # session every pool was LEWATI and signal_enter opened nothing)
collectors:
  swap_stream:
    credit_budget: 20000             # ~40% of the 5 h budget
rpc:
  quota:
    session_credit_budget: 28000
