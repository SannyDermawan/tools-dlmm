    transaction_profile: { churn: high, notes: "Time stop 15 min plus re-entry every 5 min: up to six round trips per pool per session." }
    capital_sensitivity:
      fixed_cost_exposure: high
      notes: "Many short positions: the fixed transaction and bin-array cost is paid per round trip and a $40 position earns little per round trip."
