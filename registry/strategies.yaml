# Strategy registry (roadmap PHASE 1) with the per-component decomposition of PHASE 2.
#
# Every strategy is split into the same nine components so strategies can be compared component by
# component instead of by name: entry, filter, side, range, position_size, exit, reentry, rebalance,
# transaction_policy. For each: what the ORIGINAL does, what WE implement, how far apart they are, and why.
#
# Deviation scale:
#   none     identical as far as we know the original
#   minor    same logic, another data source or value (e.g. fee range 1-3 % instead of 2 %)
#   major    a rule was dropped, added or replaced (e.g. an LLM step removed, a re-entry rule we added)
#   unknown  the original does not state it; only for sources that are summaries (tweets, images)
#   n/a      nothing to compare: our own design, or a strategy we have not implemented
#
# Rules (test/registry.test.ts, `dlmm registry --check`):
#  - `status: implemented` entries name a grid entry mode; the list matches grid.entry_modes both ways.
#  - `source.verified`: source_code (we read the code), summary_only (tweet / image / README-level, unverified), internal.
#  - `fidelity`: faithful (no major deviation), interpretation (our reading), not_implemented, n/a.
#  - One repository is not one strategy: see `sources` for forks and siblings.
#  - Nothing here is frozen (`universe.frozen: false`). Freezing Strategy Universe v1 is the owner's decision.
#  - Numbers in `evidence` are simulator results on virtual $1000 positions from 2 live 2 h sessions
#    (2026-09-29 / 09-30); they conclude nothing yet (roadmap: 5 sessions = a pipeline check only).

universe:
  version: v1
  frozen: false
  updated: "2026-09-30"
  note: "Candidates and references are listed to be tested later; adding one to the grid is a separate step with its own tests."

