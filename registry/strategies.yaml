  - id: yunus_flip
    name: Quote-only bid-ask, hold, flip above
    kind: external
    status: implemented
    entry_mode: yunus_flip
    source: { name: "Yunus (@0xyunss) / EvilPanda, public tweet summaries", url: null, verified: summary_only }
    fidelity: interpretation
    components:
      entry:
        original: "Place a quote-only bid-ask below the price on a memecoin (summary: mcap at least $5M)."
        implemented: "Memecoin pool, risk token = base X, TVL >= 10k; the mcap, age and ATH-drawdown screens exist but are off."
        deviation: minor
        reason: "Left off so that the report slices by them instead of assuming them."
        where: "presets/yunus.yaml screen, src/sim/yunus.ts evaluateYunus"
      filter: { original: "Not stated beyond the token choice.", implemented: "No mint or freeze authority; missing security data skips the pool.", deviation: minor, reason: "Our safety screen added." }
      side: { original: "Quote-only first, base-only after the price fell through the position.", implemented: "The same (the flip).", deviation: none }
      range:
        original: "Downside -30 / -50 / -70 / -90 % below the price; the flip above the new price."
        implemented: "Bid-ask 50 / 70 % below the price or the ATH; flip +100 % above the new price, plain bid-ask or 70:30 bid-ask : spot."
        deviation: minor
        reason: "Levels chosen for the grid; the source gives a family of values."
        where: "presets/yunus.yaml entry, flip"
      position_size: { original: "Not recorded in our summary.", implemented: "simulation.virtual_capital_usd per position.", deviation: unknown, reason: "No size in the summary." }
      exit:
        original: "No stop loss: hold until the position is fully converted to the token, then flip; leave when the cycle completes or at break-even after having been under water."
        implemented: "breakeven_exit (under water 5 %, target 0, cap 24 h) or a plain 24 h time stop as the control; the cycle also ends when fully back in quote."
        deviation: minor
        reason: "A time cap was added so that a cycle always ends inside a session."
        where: "presets/yunus.yaml exit"
      reentry: { original: "Not stated.", implemented: "A new cycle 30 min after the previous one closed, at most 2 per pool.", deviation: major, reason: "Our addition, to make repeated cycles measurable." }
      rebalance: { original: "Flip when fully converted to the token.", implemented: "The same, up to 2 flips per position.", deviation: none, where: "src/sim/gridRunner.ts tryFlip" }
      transaction_policy: { original: "Not stated.", implemented: "Our cost model: open, flips and close; no balancing swap after the first deposit.", deviation: unknown, reason: "No stated policy." }
    notes:
      - "Built from summaries, not code. It is NOT the Meridian fork's policy (royalmand): there is no flip in that code. Nor is it the wide two-sided playbook of evil_panda (a separate summary)."
      - "The closest public code for the flip is hummingbot's lp_rebalancer (BUY = quote-only below the price, SELL = base-only above, re-open on the other side after an auto-close), whose documented default size is $50."
      - "Meridian's upstream strategy library also has single_sided_reseed (token-only bid-ask, re-open lower without swapping), which our variant single_sided_reseed models."
    transaction_profile: { churn: low, notes: "A cycle can last hours; transactions are open, flips and close; no balancing swap after the first deposit." }
    capital_sensitivity:
      fixed_cost_exposure: low
      notes: "Break-even 0.12 % at $1000 of which about half is the transaction fee; projected about 1.7 % at $40 (paper estimate, not measured)."
    evidence:
      - "382 positions in 2 sessions, +3.4 pp vs baseline, better in 4 of 4 cohorts with entries; but 376 of them opened in the first cohort of each session (188 each), so it is about two samples, and cycles rarely complete within 2 h (censored)."

  # ================================================================= external, candidates and references (not in the grid)
  - id: royalmand
    name: royalmand (the Meridian fork's own `evil_panda` policy, not the @EvilPanda playbook)
    kind: external
    status: implemented
    entry_mode: royalmand
    source: { name: "fciaf420/meridian prompt.js, tools/dlmm.js, config.js (the `evilPanda` block; the fork's own policy)", url: "https://github.com/fciaf420/meridian", verified: source_code }
    fidelity: interpretation
    components:
      entry: { original: "Token 24 h volume >= $750k, market cap >= $200k and a green 5-minute Supertrend with the price above it (GMGN data); otherwise skip (hard skip in code).", implemented: "Same thresholds; the token 24 h volume and market cap come from the Jupiter audit, the Supertrend (period 10, multiplier 3) from our own 5-minute OHLCV, direction up on the last complete candle.", deviation: minor, reason: "Other data sources than GMGN; the fork does not state its Supertrend parameters.", where: "presets/evil_panda.yaml screen, src/strategies/evilPanda.ts evaluateEvilPanda" }
      filter: { original: "The Meridian screen plus token fees >= 30 SOL and top 10 real holders <= 60 %.", implemented: "Our Meridian preset screen (presets/meridian.yaml) must pass, plus token fees >= 30 SOL (Jupiter audit) and top-10 holders <= 60 % (our security row).", deviation: minor, reason: "Our Meridian screen drops the LLM pick and narrative check (see meridian_preset); our top-10 share is not filtered for LP and exchange wallets.", where: "src/strategies/evilPanda.ts" }
      side: { original: "Single-sided SOL (amount_y only); two-sided spot and bid-ask are refused by deploy_position.", implemented: "Quote-only below the price; the token must be the base X so that the quote side is SOL.", deviation: none, where: "presets/evil_panda.yaml range" }
      range: { original: "Spot, price_range_pct 80, bins_above 0, at least that range.", implemented: "Spot, 80 % below the price, bins above 0 (bins from the pool's bin step).", deviation: none, where: "presets/evil_panda.yaml range" }
      position_size: { original: "Meridian sizing: min(50 SOL, 35 % of (total - 0.2 SOL gas reserve)), floor 0.5 SOL.", implemented: "The session's virtual capital per position ($1000 by default; capital profiles $40-$100).", deviation: major, reason: "Every entry mode is compared at the same virtual size; sizing is a capital question (dlmm capital), not part of the entry." }
      exit: { original: "Close only while PnL is positive and 5-minute RSI(2) > 90 with the close above the Bollinger upper band or the first green MACD histogram; the other Meridian exits still apply.", implemented: "Same confluence on our complete 5-minute candles (RSI 2 > 90, Bollinger 20 / 2, MACD 12 / 26 / 9 histogram turning green) while net PnL > 0; our Meridian preset's exit policy runs as well.", deviation: minor, reason: "Candles from our OHLCV instead of GMGN; Meridian's other exits are our preset's version.", where: "src/strategies/evilPanda.ts evaluateExit" }
      reentry: { original: "The next screener cycle may pick the pool again; nothing specific to the policy.", implemented: "One position at a time per pool; a new one 15 min after the close, at most 3 per pool and session.", deviation: major, reason: "The source has no rule; a screener cycle is our re-entry tick." }
      rebalance: { original: "None specified.", implemented: "None.", deviation: none }
      transaction_policy: { original: "Meridian's: priority fee Medium, an 80 % range needs several transactions at bin step 100.", implemented: "Our cost model: priority fee percentile, an 80 % range at bin step 100 is about 161 bins = 3 transactions per open and close.", deviation: minor, reason: "Our priority-fee model, not Meridian's Medium setting." }
    notes:
      - "Runs as entry mode royalmand through the standard strategy interface (src/strategies, roadmap PHASE 3); its exit is the first module-specific evaluateExit."
      - "The fork's code names this policy `evil_panda`. It is the fork author's own (GMGN volume + Supertrend + RSI(2) exit), nothing in it is the @EvilPanda playbook (token age >= 48 h, wide two-sided bid-ask held for days), which is the strategy evil_panda below. Whether the fork borrowed the name from him is not known."
      - "The author's own claim in the prompt (spot without a SOL split -10.75 %, with split +7.48 % at 73 % wins) comes from his lessons file, unverified."
    transaction_profile: { churn: low, notes: "One position at a time per pool; exit only on the indicator confluence while in profit." }
    capital_sensitivity: { fixed_cost_exposure: low, notes: "Few transactions; an 80 % wide single-sided range needs about 160 bins at bin step 100 -> several transactions." }
    evidence: []

