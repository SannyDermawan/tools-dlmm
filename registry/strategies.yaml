  # ================================================================= external, implemented
  - id: meridian_preset
    name: Meridian default screen
    kind: external
    status: implemented
    entry_mode: meridian_preset
    source: { name: "Meridian (yunus-0x/meridian, fciaf420 fork)", url: "https://github.com/yunus-0x/meridian", verified: source_code }
    fidelity: interpretation
    components:
      entry:
        original: "Screener cycle every 30 min over a discovery-API query (timeframe 5m, category trending), hard skips in code, then an LLM picks one high-conviction pool per cycle."
        implemented: "Top 3 passing pools per cohort, ranked by fee/TVL x 1000 + organic x 10 + volume / 100 + holders / 100."
        deviation: major
        reason: "The LLM pick and the trending ranking are replaced by a deterministic ranking (our rule: no LLM decides). The code sorts by fee / active TVL and then other keys (screening.js); the weighted formula comes from our addendum."
        where: "presets/meridian.yaml ranking, src/sim/meridian.ts evaluateMeridian"
      filter:
        original: "API query: bin step 80-125, fee / active TVL >= 0.05, TVL 10k-150k, volume >= 500, mcap 150k-10M, holders >= 500, base and quote organic >= 60, no critical warnings, no high single ownership, SOL-quoted, not blacklisted. Hard skips in code: token fees < 30 SOL, top 10 real holders > 60 %. Prompt rules: bundlers > 30 % skip, narrative check, smart wallets."
        implemented: "The same numeric filters except quote organic, high single ownership, SOL-quote and trending ranking; our own bot-holder limit 30 %. Optional and off: token fees, critical warnings, bundlers, volatility, price change, bin utilization."
        deviation: major
        reason: "The LLM narrative and smart-wallet steps are excluded by our no-LLM rule; several API flags are not reproduced; the optional filters stay off until their distribution is measured."
        where: "presets/meridian.yaml pool_filter, token_filter"
      side: { original: "Single-sided SOL: bid-ask, bins below the active bin only (two-sided spot only under four strict conditions).", implemented: "quote_only.", deviation: minor, reason: "Only the default side is modelled." }
      range:
        original: "price_range_pct from a volatility table or candle-based depth (max drawdown x 1.3 + ATR), minimum 35 %, maximum 80 %, at least 20 bins; wider than 70 bins by several transactions."
        implemented: "Bid-ask, 69 bins below the price (min_bins_below 35), fixed."
        deviation: major
        reason: "The adaptive depth is replaced by a fixed width."
      position_size: { original: "min(maxDeployAmount 50 SOL, positionSizePct 0.35 x (total SOL - 0.2 SOL gas reserve)), floor 0.5 SOL, at most 3 positions.", implemented: "simulation.virtual_capital_usd per position; top 3 pools per cohort.", deviation: minor, reason: "A fixed virtual size instead of a share of the wallet." }
      exit:
        original: "Stop loss (upstream code default -50, the fork's -20, its README -15), take profit 5 % of capital, trailing 3 % / 1.5 %, out of range 30 min, emergency drop; an LLM manager every 10 min may also close."
        implemented: "tp_sl_combo: stop loss 15 %, take profit 5 %, trailing 3 % / 1.5 %, confirm 15 s, out of range 30 min."
        deviation: minor
        reason: "Stop loss differs (15 vs -50 / -20 in code) and the LLM manager's exits are excluded."
        where: "presets/meridian.yaml exit, src/sim/policies.ts tp_sl_combo"
      reentry: { original: "The next screener cycle may deploy again; pool memory feeds the LLM prompt. No re-entry rule in code.", implemented: "None.", deviation: major, reason: "Dropped: it exists only as LLM judgement." }
      rebalance: { original: "None: out of range means close (the manager decides).", implemented: "None.", deviation: none }
      transaction_policy: { original: "Priority fee level Medium; claim fees from $5; swap price impact cap 5 % on entry, 25 % on close.", implemented: "Our cost model; no claims (fees accrue inside the position).", deviation: minor, reason: "Modelled costs instead of the bot's settings." }
    notes:
      - "Top 10 > 60 % is a hard code skip in Meridian (index.js), bundlers > 30 % only a rule in the LLM prompt, and bot holders have no threshold there; our 30 % is our own."
      - "Meridian filters on Meteora's pool-discovery API (5 m windows, volatility, price change); we now collect the same API (collectors.pool_discovery) for the optional volatility / price change / critical-warning filters."
    transaction_profile: { churn: low, notes: "One open per cohort and pool; exit on out of range, stop or take profit." }
    capital_sensitivity: { fixed_cost_exposure: low, notes: "Few transactions; TVL 10k-150k keeps the price impact of a $40 position negligible." }
    evidence:
      - "Session 1: evaluated 75, passed 0 (filters too strict for the 25 pools watched). Session 2: 7 positions, -4.4 pp vs baseline, worse in 3 of 3 cohorts (n too small)."

